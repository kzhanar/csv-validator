# Ticketing config: tickets as files in the repo (default). Read by every skill that creates, reads, or moves tickets.
# A starter: at first use the skill copies the chosen one to _bmad/custom/ticketing-store-config.toml
# (references/store-setup.md), and that copy is the one edited. An org can instead host its own starter
# anywhere — a repo path or a url — and setup copies from it. Skills read [tickets] and [verbs] through a script, so comments are never loaded.
# Every ticketing config has the same fields; only the prose and the maps differ.

description = "Quick setup, and the default when nothing else is chosen. Tickets are markdown files under version control: in the monorepo, or in their own repo. No tracker or account needed."

[tickets]
store = "repo"

access = "Read and write the files under `output_folder`."

fields = "risk and severity live in the frontmatter (risk: low|medium|high on any ticket; severity: P0-P3 on bugs); estimate and estimate_basis the same way."

reference = "A reference is a line in the ticket's References section: `type — location, section`, location a path from {project-root} or a url for a remote source, opened before it is cited."

[verbs]
setup = "Tickets live in `output_folder` beside the documents. Create `backlog/` and the active initiative's folder there when they do not exist."

write = "No entry yet: add an `[[entry]]` with the next unused `id` to the parent's `tickets.toml`. Every change is an edit to the file."

query = "A ticket is named by its path and its `id` under its epic. `tickets.py find <folder> <ref>` resolves an id or title words."

[tickets.types]
initiative = "initiative"
epic = "epic"
story = "story"
spike = "spike"
bug = "bug"

[tickets.status]
backlog = "backlog"
in-progress = "in-progress"
review = "review"
done = "done"
dropped = "dropped"
